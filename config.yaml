baseURL: "https://ibrunotome.github.io/"
title: "Bruno Tomé"

module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [HTML, RSS, LLMS]
  page: [HTML]

outputFormats:
  llms:
    baseName: llms
    mediaType: text/plain
    isPlainText: true
    notAlternative: true

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
summaryLength: 30

pagination:
  pagerSize: 5

# Keep Portuguese at /pt and English at /, including existing front matter URLs.
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    contentDir: content/en
    label: English
    locale: en-US
    weight: 10
    params:
      description: "Welcome to my blog"
      llms:
        description: "Bruno Tomé's personal blog and professional profile, covering full-stack software development, cloud infrastructure, and DevOps."
    menu:
      main:
        - name: About
          pageRef: /about
          weight: 30
        - name: Search
          weight: 40
          params:
            type: search
        - name: Language
          weight: 50
          params:
            type: language-switch
        - name: GitHub
          url: "https://github.com/ibrunotome"
          weight: 60
          params:
            icon: simple:github
        - name: Stack Overflow
          url: "https://stackoverflow.com/users/3238672/ibrunotome?tab=profile"
          weight: 70
          params:
            icon: simple:stackoverflow
  pt:
    contentDir: content/pt
    label: Português
    locale: pt-BR
    weight: 20
    params:
      description: "Bem vindo ao meu blog"
      llms:
        description: "Blog pessoal e perfil profissional de Bruno Tomé, com conteúdo sobre desenvolvimento de software full-stack, infraestrutura na nuvem e DevOps."
    menu:
      main:
        - name: Sobre
          pageRef: /sobre
          weight: 30
        - name: Buscar
          weight: 40
          params:
            type: search
        - name: Idioma
          weight: 50
          params:
            type: language-switch
        - name: GitHub
          url: "https://github.com/ibrunotome"
          weight: 60
          params:
            icon: simple:github
        - name: Stack Overflow
          url: "https://stackoverflow.com/users/3238672/ibrunotome?tab=profile"
          weight: 70
          params:
            icon: simple:stackoverflow

minify:
  disableXML: true
  minifyOutput: true

params:
  description: "Bem vindo ao meu blog"
  author:
    name: "Bruno Tomé"
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  footer:
    displayCopyright: false
    displayPoweredBy: false
  search:
    enable: true
  blog:
    list:
      sortBy: date
      sortOrder: desc
      pagerSize: 5
      displayTags: true
  toc:
    displayTags: true

markup:
  goldmark:
    renderer:
      # Existing articles include images written as HTML.
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
